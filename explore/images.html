<script>
document.addEventListener("DOMContentLoaded", () => {
  const modal = document.getElementById("explore-modal");
  const modalTitle = document.getElementById("explore-modal-title");
  const track = document.getElementById("explore-carousel-track");
  const closeBtn = document.querySelector(".explore-close");
  const prevBtn = document.querySelector(".explore-prev");
  const nextBtn = document.querySelector(".explore-next");
  const captionEl = document.getElementById("explore-caption");
  const dotsContainer = document.getElementById("explore-carousel-dots"); // ✅ NEW

  let currentImages = [];
  let currentIndex = 0;

  // --- Open Modal ---
  document.querySelectorAll(".explore-item").forEach(item => {
    item.addEventListener("click", () => {
      const personName = item.dataset.person;
      const person = window.explorePeople?.[personName];
      if (!person || !person.images || person.images.length === 0) {
        console.warn("No images found for", personName);
        return;
      }

      modalTitle.textContent = person.name;
      currentImages = person.images;
      currentIndex = 0;

// --- Update Story Link ---
        const storyLink = document.getElementById("explore-story-link");
        if (person.firstname && person.url) {
        storyLink.textContent = `${person.firstname}'s Story →`;
        storyLink.href = person.url;
        storyLink.style.display = "block";
        } else {
        storyLink.style.display = "none";
        }
    

      // Build slides
      track.innerHTML = currentImages.map(img => `
        <div class="explore-slide">
          <img src="${img.src}" alt="">
        </div>
      `).join('');

      // ✅ Build tracker dots
      dotsContainer.innerHTML = currentImages.map((_, i) => `
        <span class="explore-dot${i === 0 ? ' active' : ''}" data-index="${i}"></span>
      `).join('');

      // ✅ Clickable dots
      dotsContainer.querySelectorAll('.explore-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          currentIndex = parseInt(dot.dataset.index, 10);
          updateCarousel();
        });
      });

      // Set first caption
      captionEl.textContent = currentImages[currentIndex]?.caption || '';

      // Activate first slide
      const slides = track.querySelectorAll('.explore-slide');
      slides.forEach((s, i) => s.classList.toggle('active', i === currentIndex));

      modal.style.display = "flex";
      updateCarousel();
    });
  });

  // --- Update Carousel ---
  function updateCarousel() {
    const slides = track.querySelectorAll('.explore-slide');
    if (!slides.length) return;

    slides.forEach((slide, i) => {
      slide.classList.toggle('active', i === currentIndex);
    });

    // update external caption
    captionEl.textContent = currentImages[currentIndex]?.caption || '';

    // ✅ update dot tracker
    const dots = dotsContainer.querySelectorAll('.explore-dot');
    dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
  }

  // --- Navigation (Buttons) ---
  function goPrev() {
    if (!currentImages.length) return;
    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
    updateCarousel();
  }

  function goNext() {
    if (!currentImages.length) return;
    currentIndex = (currentIndex + 1) % currentImages.length;
    updateCarousel();
  }

  prevBtn.addEventListener("click", e => {
    e.stopPropagation();
    goPrev();
  });

  nextBtn.addEventListener("click", e => {
    e.stopPropagation();
    goNext();
  });

  // --- Keyboard Navigation ---
  document.addEventListener("keydown", e => {
    if (modal.style.display !== "flex") return; // only when modal open
    if (e.key === "ArrowLeft") goPrev();
    if (e.key === "ArrowRight") goNext();
    if (e.key === "Escape") modal.style.display = "none";
  });


  // --- Close Modal ---
  closeBtn.addEventListener("click", () => modal.style.display = "none");
  modal.addEventListener("click", e => {
    if (e.target === modal) modal.style.display = "none";
  });
});

</script>
