<script>
const modal = document.getElementById("explore-modal");
const closeBtn = document.querySelector(".explore-close");

const titleEl = document.getElementById("sound-modal-title");
const coverEl = document.getElementById("sound-modal-cover");
const listEl = document.getElementById("sound-modal-soundlist");
const storyLinkEl = document.getElementById("sound-story-link");
  const TAG_LINKS = {
    "All Sounds": "/explore/sounds",
    "Loud": "/explore/sounds_loud",
    "Repetitive": "/explore/sounds_repetitive",
    // ... add more as needed
  };
document.addEventListener("DOMContentLoaded", () => {



  const selector = document.getElementById("tag-selector");
  const submitBtn = document.getElementById("tag-submit-btn");

  // Debug check
  if (!selector) {
    console.warn("Tag selector element not found.");
    return;
  }

  // Populate dropdown
  Object.keys(TAG_LINKS).forEach(tag => {
    const option = document.createElement("option");
    option.value = tag;
    option.textContent = tag;
    selector.appendChild(option);
  });

  // Click behavior
  submitBtn.addEventListener("click", () => {
    const selected = selector.value;

    if (!selected) {
      alert("Please select a tag first.");
      return;
    }

    window.location.href = TAG_LINKS[selected];
  });

});


document.querySelectorAll(".explore-item").forEach(item => {
  item.addEventListener("click", () => {
    const personName = item.dataset.person;
    const person = window.explorePeople[personName];

    if (!person) return;

    // SET TITLE
    titleEl.textContent = person.name;

    // SET COVER IMAGE
    coverEl.src = person.coverImg || "";

    // SET STORY LINK
    storyLinkEl.href = person.url;
    storyLinkEl.textContent = `${person.firstname}'s Story →`;

    // BUILD SOUND LIST
    listEl.innerHTML = "";
    person.sounds.forEach((sound, index) => {
      const div = document.createElement("div");
      div.className = "sound-item";

      let tags = Object.keys(sound)
        .filter(k => k.startsWith("tag_") && sound[k])
        .map(k => sound[k]);

      let tagHTML = "";
      if (tags.length > 0) {
        tagHTML = `
          <div class="sound-tags">
            ${tags.map(tag => {
              const url = TAG_LINKS[tag] || "#";
              return `<a class="sound-tag" href="${url}">${tag}</a>`;
            }).join("")}
          </div>
        `;
      }

      div.innerHTML = `
        <audio controls src="${sound.src}"></audio>

        <div class="sound-caption-toggle" data-index="${index}">
          <span class="arrow">&#8250;</span> About This Sound
        </div>

        <div class="sound-caption" id="caption-${index}">
          ${tagHTML}
          <p>${sound.caption}</p>
        </div>
      `;

      listEl.appendChild(div);
    });

    // Dropdown behavior
    listEl.querySelectorAll(".sound-caption-toggle").forEach(toggle => {
      toggle.addEventListener("click", () => {
        const idx = toggle.dataset.index;
        const cap = document.getElementById(`caption-${idx}`);
        cap.classList.toggle("open");
        toggle.classList.toggle("open");

      });
    });

    // Open modal
modal.style.display = "block";


  });
});

// Close modal
closeBtn.addEventListener("click", () => {
  modal.style.display = "none";
});

// Click outside closes modal
window.addEventListener("click", e => {
  if (e.target === modal) modal.style.display = "none";
});
</script>
